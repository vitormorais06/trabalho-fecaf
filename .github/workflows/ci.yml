# Nome da nossa automação (Pipeline)
name: Controle de Qualidade - TechFlow

# Define os gatilhos: A automação vai rodar sempre que fizermos um Push
on: [push]

jobs:
  build:
    # Máquina virtual onde o teste será executado (Ubuntu)
    runs-on: ubuntu-latest

    steps:
    # Passo 1: Baixa o código do nosso repositório para a máquina virtual
    - uses: actions/checkout@v3
    
    # Passo 2: Configura a linguagem Python na máquina virtual
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    # Passo 3: Instala o Flask e o PyTest definidos no requirements.txt
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    # Passo 4: Executa a pasta de testes para verificar se o código está quebrado
    - name: Rodar Testes
      run: |
        pytest